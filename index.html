    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "224db4ea-d943-40d3-ac5e-b072a35a327e",
        });

        OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(event) {
          console.log("Notification about to display:", event.notification);

          // Option A: suppress the default notification and show your own in-page UI
          //event.preventDefault();
          //showMyInAppBanner(event.notification);

          localStorage.setItem("notification", JSON.stringify(event.notification));

          // Option B: do nothing and let OneSignal display it normally
        });
      });
    </script>
